name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux entra porque o README convida contribuidores Linux: sem CI
        # que compile lá, quem contribui de lá quebra o build sem saber.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --workspace --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace --locked

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      # Clippy entra como ERRO, não aviso: num projeto público, aviso que não
      # quebra o CI vira dívida que ninguém paga.
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
