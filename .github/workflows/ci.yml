name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux entra porque o README convida contribuidores Linux: sem CI
        # que compile lá, quem contribui de lá quebra o build sem saber.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev             libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Frontend streaming, queue and cancellation tests
        run: npm test

      - name: Install browser for UI tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Chat and performance UI tests
        if: runner.os == 'Linux'
        run: npm run test:e2e

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --workspace --locked

      # `--no-fail-fast` porque o cargo para no primeiro binário de teste que
      # falha, e o workspace tem 20+ crates: uma quebra específica de um
      # sistema custaria uma rodada de CI por crate para aparecer inteira.
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace --locked --no-fail-fast

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      # Clippy entra como ERRO, não aviso: num projeto público, aviso que não
      # quebra o CI vira dívida que ninguém paga.
      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Fora da matriz de propósito: a documentação é a mesma nos três sistemas, e
  # este job não precisa de Rust nem de `npm ci` — os scripts usam só a stdlib
  # do Node. São ~15 segundos, e falham antes de a matriz terminar de compilar.
  docs:
    name: Documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Paridade EN↔PT, cobertura da barra lateral e links versionados.
      - name: Paridade da documentação
        run: node scripts/docs-parity.mjs

      # O CHANGELOG é gerado de `docs/releases/`; aqui só se confere que ele
      # está em dia. Regravar vem do humano, como o `cargo fmt --check`.
      - name: CHANGELOG em dia com docs/releases/
        run: node scripts/release-notes.mjs --changelog --check
