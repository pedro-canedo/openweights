# Builds llama.cpp com GGML_RPC=ON na mesma tag pinada do app.
#
# Os zips oficiais do llama.cpp não compilam o backend RPC. Este workflow
# gera o overlay que o RuntimeManager baixa quando o cluster é ligado:
# llama-server com --rpc + ggml-rpc-server.
#
# Publica (ou atualiza) o release `llama-rpc-<tag>` no repositório
# OpenWeights. Disparar à mão depois de promover PINNED_TAG.
#
# O release NÃO pode ser draft: o app baixa sem autenticação. Assets em
# rascunho devolvem 404.

name: llama-rpc overlay

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do llama.cpp (ex. b10441)"
        required: true
        default: "b10441"

permissions:
  contents: write

jobs:
  macos-metal:
    name: macOS arm64 Metal+RPC
    runs-on: macos-14
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.tag }}

      - name: Build
        run: |
          cmake -B build \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_RPC=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j --target llama-server ggml-rpc-server

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN=build/bin
          if [ ! -x "$BIN/llama-server" ]; then BIN=build; fi
          cp "$BIN/llama-server" "$BIN/ggml-rpc-server" dist/
          # TODAS as dylibs: além de ggml e llama, o llama-server linka
          # libmtmd (multimodal). Copiar só as duas primeiras dá um binário
          # que não abre.
          if ls "$BIN"/*.dylib >/dev/null 2>&1; then
            cp "$BIN"/*.dylib dist/
          fi
          cp "$BIN"/*.metallib dist/ 2>/dev/null || true
          test -x dist/llama-server
          test -x dist/ggml-rpc-server
          tar -czf llama-${{ inputs.tag }}-rpc-macos-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: rpc-macos-arm64
          path: llama-${{ inputs.tag }}-rpc-macos-arm64.tar.gz

  windows-cuda:
    name: Windows CUDA+RPC
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4", "13.3"]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.tag }}

      - name: CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "${{ matrix.cuda }}.0"
          method: network
          # GGML_CUDA=ON linka CUDA::cublas/cublasLt e usa thrust; só nvcc e
          # cudart fazem o `cmake -B build` falhar no configure. O
          # visual_studio_integration é o que faz o MSBuild achar os alvos CUDA.
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","thrust","nvrtc","nvrtc_dev","visual_studio_integration"]'

      - name: Build
        shell: pwsh
        run: |
          cmake -B build -DGGML_CUDA=ON -DGGML_RPC=ON -DGGML_NATIVE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j --target llama-server ggml-rpc-server

      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = if (Test-Path build/bin/Release) { "build/bin/Release" } elseif (Test-Path build/bin) { "build/bin" } else { "build" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$bin/llama-server.exe" dist/
          Copy-Item "$bin/ggml-rpc-server.exe" dist/
          Get-ChildItem $bin -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination dist
          if (-not (Test-Path dist/llama-server.exe) -or -not (Test-Path dist/ggml-rpc-server.exe)) {
            throw "faltou llama-server.exe ou ggml-rpc-server.exe no pacote"
          }
          Compress-Archive -Path dist/* -DestinationPath "llama-${{ inputs.tag }}-rpc-win-cuda-${{ matrix.cuda }}-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rpc-win-cuda-${{ matrix.cuda }}
          path: llama-${{ inputs.tag }}-rpc-win-cuda-${{ matrix.cuda }}-x64.zip

  publish:
    needs: [macos-metal, windows-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: llama-rpc-${{ inputs.tag }}
          name: llama.cpp RPC overlay ${{ inputs.tag }}
          draft: false
          # O updater do app consulta releases/latest/download/latest.json.
          # Sem estes dois, o overlay vira a "latest" do repositório e a
          # atualização automática para de encontrar o arquivo — em silêncio,
          # para todo mundo, até a próxima release do app.
          make_latest: false
          prerelease: true
          files: artifacts/**/*
          body: |
            Overlay `GGML_RPC=ON` para o OpenWeights, mesma tag do runtime pinado.
            Pasta própria (`…/cuda-13.3-rpc`), não por cima do zip oficial.
            Traz `llama-server` com `--rpc` e `ggml-rpc-server`.
