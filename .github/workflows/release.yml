# Instalador pronto a cada tag `v*`.
#
# O `ci.yml` responde "o código está são?"; este responde "dá para instalar?".
# São coisas diferentes: `cargo check` passa em coisa que não empacota (ícone
# faltando, identifier inválido, alvo de bundle indisponível), e descobrir isso
# na hora do lançamento é o pior momento possível.
#
# O release nasce como RASCUNHO: o binário é gerado, anexado e fica esperando
# alguém ler as notas e apertar publicar. Publicar sozinho, a partir de um
# push, é rápido demais para uma ação que não tem desfazer.
#
# Os binários NÃO são assinados (não há certificado de code signing, que custa
# caro e é anual). O Windows mostra o aviso do SmartScreen e o macOS bloqueia
# no Gatekeeper — o README explica o contorno. Assinar é o caminho quando o
# projeto tiver orçamento; fingir que já está assinado seria pior.

name: Release

on:
  push:
    tags: ["v*"]
  # Permite ensaiar o empacotamento inteiro sem criar tag nenhuma.
  workflow_dispatch:

# Só um lançamento por vez: dois workflows escrevendo no mesmo release se
# atropelam e um sobrescreve o artefato do outro.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nome: Windows (x64)
          # Um `.dmg` universal em vez de um por arquitetura: o runner Intel
          # (`macos-13`) está em fim de vida e ficou uma hora na fila no
          # primeiro ensaio — um lançamento não pode depender de máquina que
          # talvez não venha. O Apple Silicon compila as duas fatias e junta.
          - os: macos-14
            target: universal-apple-darwin
            rustup: aarch64-apple-darwin,x86_64-apple-darwin
            nome: macOS (universal)
          # `ubuntu-22.04` e não a mais nova de propósito: o binário exige a
          # glibc da máquina que o compilou ou mais recente, e compilar na
          # 24.04 deixaria de fora quem ainda está na 22.04.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            nome: Linux (x64)

    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `universal-apple-darwin` não é alvo de rustup: é a junção de dois.
          targets: ${{ matrix.rustup || matrix.target }}

      # O cache do Rust é o que separa um lançamento de 10 minutos de um de
      # 40: o workspace tem 20+ crates e o Tauri arrasta a árvore inteira.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Empacotar e anexar ao rascunho do release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura do updater (minisign). Sem ela o app instalado recusa
          # a atualização — e é isso que queremos: o pacote tem de provar que
          # veio deste projeto antes de substituir o binário de alguém.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # O `latest.json` é o que o app consulta para saber se há versão
          # nova; sem ele os instaladores existem e ninguém é avisado.
          includeUpdaterJson: true
          # A tag manda; num `workflow_dispatch` (sem tag) o rascunho sai como
          # `v0.0.0-dev` e é descartável.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
          releaseName: OpenWeights ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
          releaseBody: |
            Installers below. **No binary is signed** — your system will warn you:

            - **Windows**: on "Windows protected your PC" → *More info* → *Run anyway*.
            - **macOS**: right-click the app → *Open* on first launch, or run
              `xattr -cr /Applications/OpenWeights.app`.

            On first launch the app downloads the llama.cpp runtime that matches
            your GPU (a few hundred MB) — that is why the installer is small.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
