[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "fs",
  "io-util",
  "net",
  "time",
  "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "http2",
] }
lr_types = { path = "crates/types" }

[package]
name = "openweights"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenWeights — rode LLMs localmente, sem conhecimento técnico"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# Aviso do sistema (cluster: pareamento, empréstimo de GPU). Quem faz isso
# direito em cada sistema é o plugin oficial.
tauri-plugin-notification = "2"
# Atualização de dentro do app. A assinatura é do próprio updater (minisign,
# de graça) e não tem relação com o certificado de code signing que falta:
# ela garante que o pacote baixado veio deste projeto, não que o sistema
# operacional confie no binário.
tauri-plugin-updater = "2"
rfd = "0.15"
# A voz neutra é uma chamada HTTP direta; o cliente já é o do workspace.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
# Chave de API do servidor local: o CSPRNG do sistema, sem arrastar um
# framework de random inteiro para gerar 20 bytes.
getrandom = "0.3"
# URLs alternativas com LAN ligada (bind 0.0.0.0): enumerar os IPv4 locais.
# O mdns-sd do cluster já traz este crate na árvore — custo zero de lockfile.
if-addrs = "0.13"
lr_types.workspace = true
lr_hw = { path = "crates/hw" }
lr_runtime = { path = "crates/runtime" }
lr_engine = { path = "crates/engine" }
lr_providers = { path = "crates/providers" }
lr_nodejs = { path = "crates/nodejs" }
lr_ninerouter = { path = "crates/ninerouter" }
lr_dshhost = { path = "crates/dshhost" }
lr_proc = { path = "crates/proc" }
lr_gateway = { path = "crates/gateway" }
lr_models = { path = "crates/models" }
lr_advisor = { path = "crates/advisor" }
lr_store = { path = "crates/store" }
lr_cluster = { path = "crates/cluster" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

[profile.release]
lto = true
codegen-units = 1
strip = true
