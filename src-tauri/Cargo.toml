[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "fs",
  "io-util",
  "time",
  "sync",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "http2",
] }
lr_types = { path = "crates/types" }

[package]
name = "rift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rode LLMs localmente, sem conhecimento técnico — llama.cpp com auto-configuração"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
lr_types.workspace = true
lr_hw = { path = "crates/hw" }
lr_runtime = { path = "crates/runtime" }
lr_engine = { path = "crates/engine" }
lr_models = { path = "crates/models" }
lr_advisor = { path = "crates/advisor" }
lr_store = { path = "crates/store" }

[profile.release]
lto = true
codegen-units = 1
strip = true
