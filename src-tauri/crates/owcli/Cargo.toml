[package]
name = "lr_owcli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Instala e verifica o runtime do OwCLI (o fork do Codex CLI integrado ao app)"

[dependencies]
lr_fetch = { path = "../fetch" }
lr_proc = { path = "../proc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

# O `Path` do usuário no registro e o aviso de mudança de ambiente.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
