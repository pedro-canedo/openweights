[package]
name = "lr_mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Conectores MCP: liga servidores externos ao catálogo de ferramentas do agente"

[dependencies]
lr_types.workspace = true
lr_tools = { path = "../tools" }
lr_store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
async-trait = "0.1"
sha2 = "0.10"
# Só para montar os cabeçalhos extras do transporte HTTP; é o mesmo tipo que
# o `rmcp` espera na configuração do cliente.
http = "1"
# SDK oficial do Model Context Protocol. Só o lado cliente e os dois
# transportes vivos da spec (stdio e streamable HTTP) — o SSE legado foi
# removido do protocolo e não é implementado aqui.
rmcp = { version = "3", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
