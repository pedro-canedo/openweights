[package]
name = "lr_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adaptadores de engine de inferência (llama-server em Router mode)"

[dependencies]
lr_proc = { path = "../proc" }
# Só pela lista do que o app gerencia: a última porta antes do spawn confere
# de novo que nenhuma variável de ambiente do usuário troca a chave de API nem
# atropela o INI por `LLAMA_ARG_*`.
lr_types = { path = "../types" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
# Com TLS: além do llama-server local em 127.0.0.1, o cliente precisa alcançar
# provedores remotos por HTTPS (OpenRouter). Ficava sem TLS de propósito, e o
# resultado era que o agente não conseguia falar com nenhum deles.
# O streaming SSE usa `Response::chunk()`, que não exige a feature "stream" —
# por isso nada de futures-util aqui.
reqwest.workspace = true
async-trait = "0.1"

# Os testes sobem um servidor HTTP falso com `std::net` (sem dependência
# nova) e rodam no runtime que o tokio do crate já traz.
