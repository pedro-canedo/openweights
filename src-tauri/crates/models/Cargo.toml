[package]
name = "lr_models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cliente Hugging Face Hub (busca GGUF) e gerenciador de downloads"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util = "0.3"
tokio-util = "0.7"
# PKCE: o desafio é sha256 do verifier, e o verifier são 32 bytes de acaso.
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

# `FSCTL_SET_SPARSE`: ver `marca_esparso` em `download.rs`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Ioctl",
  "Win32_System_IO",
] }
