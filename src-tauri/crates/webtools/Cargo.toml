[package]
name = "lr_webtools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferramentas de internet do agente: busca, leitura de página, chamada HTTP e download"

[dependencies]
lr_types.workspace = true
lr_tools = { path = "../tools" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
async-trait = "0.1"
# `rustls-tls` (via workspace): mesmo TLS dos outros crates, sem depender de
# OpenSSL do sistema. O `url` que validamos vem reexportado como
# `reqwest::Url` — nenhuma dependência nova entra por causa disso.
reqwest.workspace = true

[dev-dependencies]
# Pasta de projeto de mentira nos testes de `web_download`.
tempfile = "3"
# Os testes sobem um servidor HTTP falso com `std::net` (mesma receita de
# `lr_engine`): nunca tocamos a internet de verdade na suíte normal.
