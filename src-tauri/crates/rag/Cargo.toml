[package]
name = "lr_rag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Índice do projeto: busca híbrida (FTS5 + vetor) sobre os arquivos do workspace"

[dependencies]
lr_types.workspace = true
lr_tools = { path = "../tools" }
lr_engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
async-trait = "0.1"
# Mesma versão do lr_store: as duas conexões abrem o MESMO arquivo .db, então
# precisam do mesmo libsqlite3-sys (um só símbolo estático no binário).
rusqlite = { version = "0.40", features = ["bundled"] }
# Embute o C do sqlite-vec e linka estaticamente (nada de .so em runtime).
sqlite-vec = "0.1.9"
# Varredura respeitando .gitignore (mesma versão que lr_tools já usa).
ignore = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
