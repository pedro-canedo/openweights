[package]
name = "lr_tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferramentas que o agente pode usar: arquivos, terminal e plano"

[dependencies]
lr_types.workspace = true
lr_policy = { path = "../policy" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
async-trait = "0.1"
similar = "2"
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
win32job = "2"
# Job Object: `win32job` cria e fecha o handle, mas não expõe os campos de
# limite de memória e de processos ativos — esses vão direto pela API.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Só para `kill(-pgid)`: matar o grupo inteiro no timeout (netos incluídos).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
