[package]
name = "lr_datatools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferramentas de dados do agente: consulta SQL em SQLite e análise de CSV"

[dependencies]
lr_types.workspace = true
lr_tools = { path = "../tools" }
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
async-trait = "0.1"
# Mesma versão do lr_store e do lr_rag: os três acabam no mesmo binário e o
# `libsqlite3-sys` só admite uma versão do símbolo estático do SQLite.
# `limits` é o que permite zerar o número de bancos anexáveis (ver sqlite.rs).
rusqlite = { version = "0.40", features = ["bundled", "limits"] }

[dev-dependencies]
tempfile = "3"
