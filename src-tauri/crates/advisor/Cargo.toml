[package]
name = "lr_advisor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Recomendação de quantização e estimativa de memória por hardware"

[dependencies]
lr_types.workspace = true
# O `block_count` do arquivo: "todas as camadas" para o llama.cpp é ele + 1.
lr_models = { path = "../models" }
serde.workspace = true
serde_json.workspace = true
# A sonda e o banco de ensaio precisam falar com os binários do runtime; o
# resto do crate segue puro, no desenho de `lr_runtime` (lib pura + casca).
lr_runtime = { path = "../runtime" }
lr_proc = { path = "../proc" }
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
