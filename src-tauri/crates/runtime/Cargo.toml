[package]
name = "lr_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Baixa, verifica e seleciona os binários prebuilt do llama.cpp"

[dependencies]
lr_types.workspace = true
lr_fetch = { path = "../fetch" }
# Uma janela de console piscando por causa de um `--version` seria pior que
# não verificar: o spawn passa pelo helper do projeto, como todos os outros.
lr_proc = { path = "../proc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
tokio.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
# Só para montar pacotes de mentira nos testes; em produção quem extrai é o lr_fetch.
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
