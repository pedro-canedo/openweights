[package]
name = "lr_desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ferramentas de área de trabalho do agente: área de transferência, aviso do sistema e abrir arquivo ou link"

[dependencies]
lr_types.workspace = true
lr_tools = { path = "../tools" }
serde_json.workspace = true
async-trait = "0.1"
# Sem `tauri` de propósito: quem fala com o sistema é o app, através do trait
# `DesktopHost`. Ver o doc de módulo em `src/lib.rs`.

[dev-dependencies]
# Pasta de projeto de mentira nos testes de `open_path`.
tempfile = "3"
# Só para o `#[tokio::test]`: `Tool::execute` é assíncrona.
tokio.workspace = true
