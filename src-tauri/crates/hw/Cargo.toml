[package]
name = "lr_hw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Detecção de hardware e telemetria em tempo real"

[dependencies]
lr_types.workspace = true
serde.workspace = true
log.workspace = true
sysinfo = "0.39"

# O teste de contrato do payload (camelCase + null) serializa de verdade.
[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.12"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_System_Performance",
  # `GetSystemFirmwareTable`: a tabela SMBIOS (velocidade e canais da RAM) sem
  # COM, sem WMI e sem spawnar nada.
  "Win32_System_SystemInformation",
] }
