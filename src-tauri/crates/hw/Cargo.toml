[package]
name = "lr_hw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Detecção de hardware e telemetria em tempo real"

[dependencies]
lr_types.workspace = true
serde.workspace = true
log.workspace = true
sysinfo = "0.39"

# O teste de contrato do payload (camelCase + null) serializa de verdade; os
# testes do Linux montam um `/sys/class/drm` de mentira numa pasta temporária.
[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

# O NVML é carregado em tempo de execução (`nvml.dll` no Windows,
# `libnvidia-ml.so.1` no Linux): sem driver NVIDIA só a inicialização falha.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
nvml-wrapper = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_System_Performance",
  # `GetSystemFirmwareTable`: a tabela SMBIOS (velocidade e canais da RAM) sem
  # COM, sem WMI e sem spawnar nada.
  "Win32_System_SystemInformation",
] }
