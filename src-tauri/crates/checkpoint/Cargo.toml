[package]
name = "lr_checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pontos de restauração dos arquivos do projeto antes das alterações do agente"

[dependencies]
# Só pelo `no_window_std`: o `git` do snapshot é filho console-subsystem e sem
# a flag pisca uma janela preta a cada tarefa do agente no Windows. Puxa
# `tokio` junto, o que não custa nada — o app inteiro já depende dele e este
# crate continua síncrono.
lr_proc = { path = "../proc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
tempfile = "3"
